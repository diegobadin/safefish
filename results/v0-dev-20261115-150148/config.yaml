version: v0
descripcion: LLM sin recuperación; mide cuánto aporta el retrieval.
kb_snapshot: null
ingest:
  sources: data/sources.yaml
  languages:
  - es
  min_chars_lang_detect: 60
  dedupe:
    exact: true
    near_threshold: 0.95
    near_method: tfidf
  pii_por_tipo:
    caso: true
    mensaje: true
    senal: false
    guia: false
  normalize:
    mode: auto
    model: gpt-4.1-mini-2025-04-14
    prompt: normalizer_v1
    min_frase_score: 0.85
    review_fraction: 0.1
    review_seed: 7
    timeout_s: 90.0
  min_casos_por_modalidad: 5
chunking:
  strategy: recursive
  chunk_size: 800
  chunk_overlap: 120
  separators:
  - '


    '
  - '

    '
  - .
  - ' '
index:
  layout: single
embeddings:
  model: text-embedding-3-small
retrieval:
  enabled: false
  query:
    strategy: raw
    facets: []
    model: gpt-4.1-mini-2025-04-14
    prompt: query_rewrite_v1
    max_queries: 4
  filter_canal: 'off'
  hybrid:
    enabled: false
    weights:
      dense: 1.0
      bm25: 0.0
  rerank:
    enabled: false
    model: null
    prompt: rerank_v1
    top_in: 20
    max_chars: 600
  mensajes_contrastivo: false
  top_k: 6
  top_n: {}
  k_eval: null
generation:
  reasoner: gpt-4.1-2025-04-14
  temperature: 0.0
  seed: 7
  prompt: reasoner_v1
  max_retries: 1
  planner: false
  planner_mode: llm
  planner_model: gpt-4.1-mini-2025-04-14
  planner_prompt: planner_v1
  planner_top_guias: 2
  planner_max_pasos: 5
  timeout_s: 60.0
postprocess:
  verifier: false
  rules: []
  cita_threshold: 0.9
  bbox_threshold: 0.8
  soporte_dirigido_margen: null
extraction:
  vision_model: gpt-4.1-2025-04-14
  vision_prompt: vision_v2
  ocr: tesseract
  ocr_lang: spa
  ocr_min_conf: 30.0
  preprocess: true
  timeout_s: 90.0
