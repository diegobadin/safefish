# V2 — Preprocesamiento estructurado (§2.3). Cambio respecto a V1: normalización LLM a
# CaseDoc/MessageDoc/SignalDoc/GuideDoc, 1 caso = 1 chunk, 4 colecciones con top_n por
# colección y plan desde Guías (planner). El razonador y su prompt no cambian.
version: v2
descripcion: Normalización + 1 caso = 1 chunk, 4 colecciones (top_n por colección), planner desde Guías.
kb_snapshot: kb-v2
ingest:
  sources: data/sources.yaml
  languages: [es]
  dedupe: {exact: true, near_threshold: 0.95, near_method: tfidf}
  normalize: {mode: auto, model: gpt-4.1-mini-2025-04-14, prompt: normalizer_v1, review_fraction: 0.1}
  min_casos_por_modalidad: 5
chunking:
  strategy: per_case
index:
  layout: per_tipo
embeddings:
  model: text-embedding-3-small
retrieval:
  enabled: true
  query: {strategy: raw}
  filter_canal: "off"
  k_eval: 4  # mismo k para comparar casos entre V1, V2a y V2 (§2.0)
  # Las guías no van al contexto del razonador: el planner las elige por metadata.
  top_n: {casos: 4, mensajes: 6, senales: 6, guias: 0}
generation:
  reasoner: gpt-4.1-2025-04-14
  temperature: 0
  seed: 7
  prompt: reasoner_v1
  max_retries: 1
  planner: true
  planner_mode: llm
  planner_model: gpt-4.1-mini-2025-04-14
  planner_prompt: planner_v1
  planner_top_guias: 2
  planner_max_pasos: 5
postprocess:
  verifier: false
  rules: []
