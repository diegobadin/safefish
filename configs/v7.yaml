# V7 — Iteración Ej4 (§2.5). Elegida por el error analysis de la Versión 1 (V6) en dev: el modo
# dominante son los falsos positivos en negativos difíciles (FPR 0.23): el contexto trae vecinos
# estafa parecidos y ningún legítimo parecido. Única variable respecto a V6: evidencia
# contrastiva en `mensajes` (mitad label=estafa, mitad label=legitimo, intercalados).
version: v7
descripcion: V6 + evidencia contrastiva (vecinos estafa y legítimos en mensajes).
kb_snapshot: kb-v2
ingest:
  sources: data/sources.yaml
  languages: [es]
  dedupe: {exact: true, near_threshold: 0.95, near_method: tfidf}
  normalize: {mode: auto, model: gpt-4.1-mini-2025-04-14, prompt: normalizer_v1, review_fraction: 0.1}
  min_casos_por_modalidad: 5
chunking:
  strategy: per_case
index:
  layout: per_tipo
embeddings:
  model: text-embedding-3-small
retrieval:
  enabled: true
  query: {strategy: multi_query, model: claude-haiku-5-5, prompt: query_rewrite_v1, max_queries: 4}
  hybrid: {enabled: true, weights: {dense: 1.0, bm25: 1.0}}
  rerank: {enabled: true, model: claude-haiku-5-5, prompt: rerank_v1, top_in: 20, max_chars: 600}
  filter_canal: "off"
  mensajes_contrastivo: true  # única variable respecto a V6
  k_eval: 4  # mismo k para comparar casos entre V1, V2a y V2 (§2.0)
  top_n: {casos: 4, mensajes: 6, senales: 6, guias: 0}
generation:
  reasoner: claude-sonnet-5-5
  temperature: 0
  seed: 7
  prompt: reasoner_v1
  max_retries: 1
  planner: true
  planner_mode: llm
  planner_model: claude-haiku-5-5
  planner_prompt: planner_v1
  planner_top_guias: 2
  planner_max_pasos: 5
postprocess:
  verifier: true
  rules: [R1, R2, R3, R4, R5]
  cita_threshold: 0.9
  bbox_threshold: 0.8
extraction:
  vision_model: claude-sonnet-5-5
  vision_prompt: vision_v2
  ocr: tesseract
  ocr_lang: spa
