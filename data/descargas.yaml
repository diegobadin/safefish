# Fuentes públicas que baja `make data` (python -m safefish.ingest.fetch) a data/raw/ (no se
# versiona). Qué fuente alimenta cada colección y cada fase: docs/datos.md.
#
# Tipos:
#   mendeley  dataset + versión; el SHA-256 de cada archivo lo publica la API de Mendeley
#   hf        repo de Hugging Face con revisión fijada (commit)
#   http      un archivo (PDF, ZIP); `sha256` opcional para fijar el contenido
#   web       una página HTML: se guarda una copia con su URL y fecha (el loader `html` la lee)
#
# Seguridad: solo HTTPS, solo los hosts de este archivo, tamaño máximo por archivo, de los ZIP
# se extraen solo los archivos de `extraer` (sin rutas relativas) y nunca se ejecuta nada. No se
# bajan los .py que traen algunos datasets ni el reporte HTML de SpaPhish (carga recursos remotos).
#
# No están: las FAQ de WhatsApp (la página se arma con JavaScript: no trae texto; si se quieren,
# guardarlas como PDF desde el navegador en data/raw/manual/) y la novedad 4671 de AFIP (es la
# misma alerta que `arca-alerta-correo`). Tampoco tanaos (sintético; su "spam" mezcla publicidad
# con estafas) ni Mishra & Soni (inglés): ver docs/datos.md.
#
# `grupo`: es (default de `make data`) · en (solo con GRUPOS=es,en; la KB filtra por idioma
# hasta que exista la traducción) · ref (material de referencia, no entra a la KB).

descargas:
  # --- Datasets de mensajes -----------------------------------------------------------------
  - id: spaphish
    tipo: mendeley
    dataset: hz2d6gz7pc
    version: 5
    archivos: ["Spaphish dataset - DiB.csv", README.txt, dataset_schema.json]
    destino: datasets/spaphish
    licencia: CC BY 4.0
    grupo: es

  - id: spearphishmx
    tipo: mendeley
    dataset: h4bxjk84jb
    version: 1
    archivos: [SpearPhishMX_dataset_publico.csv, SpearPhishMX_README.txt, SpearPhishMX_schema_es.json]
    destino: datasets/spearphishmx
    licencia: CC BY 4.0
    grupo: es

  - id: spamshield-es                 # acceso restringido: aceptar términos en HF + HF_TOKEN en .env
    tipo: hf
    repo: M-Arjun/SpamShield-Datasets
    revision: ccf3cdd831235a47361eca4995b82ef221ff3406
    archivos: [Spanish/clean-00001.jsonl, README.md]
    destino: datasets/spamshield
    licencia: CC BY 4.0
    grupo: es

  - id: uci-sms-spam
    tipo: http
    url: https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip
    archivo: sms_spam_collection.zip
    extraer: [SMSSpamCollection, readme]
    destino: datasets/uci-sms-spam
    licencia: CC BY 4.0
    grupo: en

